name: ci
on:
  push:
    branches: ["main", "wo/**"]
  pull_request:
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          if [ -f pyproject.toml ]; then python -m pip install -e ".[dev]"; else echo "no package yet"; fi
      - name: Lint
        run: if [ -f pyproject.toml ]; then ruff check .; else echo skip; fi
      - name: Test (offline, no .env)
        run: if [ -f pyproject.toml ]; then python -m pytest -q; else echo skip; fi
