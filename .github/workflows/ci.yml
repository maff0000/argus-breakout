name: ci
on:
  push:
    branches: ["main", "wo/**"]
  pull_request:
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Sync
        run: if [ -f pyproject.toml ]; then uv sync --all-extras; else echo "no package yet"; fi
      - name: Lint
        run: if [ -f pyproject.toml ]; then uv run ruff check .; else echo skip; fi
      - name: Test (offline, no .env)
        run: if [ -f pyproject.toml ]; then uv run python -m pytest -q; else echo skip; fi
