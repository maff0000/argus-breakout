# Argus-Breakout gitleaks configuration. Extends the default rules.
# Add scoped allowlist entries here for genuine false positives — never
# bypass the hook with --no-verify.
[extend]
useDefault = true

[allowlist]
description = "placeholders in documentation and examples"
regexes = [
  '''<[a-z0-9_-]+>''',
  '''replace-me''',
]
paths = [
  '''\.env\.example$''',
]

# Flags a staged file by its PATH, regardless of content, so an empty-looking
# or oddly formatted key file is still blocked. Narrow on purpose: requires a
# provider/credential word, so requirements.txt-style names do not match.
[[rules]]
id = "argus-bare-key-file"
description = "Credential-shaped file name (provider key/token/secret file)"
path = '''(?i)(polygon|fmp|ibkr|llm|api)[-_. ]?(key|token|secret)?\.(txt|key|json)$'''
